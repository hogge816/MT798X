name: 25.12 S20P high power

on:
  push:
    branches: [25.12-s20-highpower]
    paths:
      - '.github/workflows/25.12-s20-highpower.yml'
      - '25.12/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev libelf-dev python3-setuptools rsync swig unzip zlib1g-dev file wget ccache bc time xxd python3-dev python3-pip cmake ninja-build libfuse-dev
      - name: Clone high-power source
        run: |
          git clone --single-branch --branch n60pro-high-power https://github.com/hxlls/n60pro-hightpower-immo.git openwrt
          git -C openwrt checkout --detach 072cd385386b5b7becad12b5c072d7ee2de01bf7
          git -C openwrt rev-parse HEAD > source-revision.txt
      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Apply main DIY scripts
        working-directory: openwrt
        run: |
          bash -e "$GITHUB_WORKSPACE/25.12/diy-part1.sh"
          bash -e "$GITHUB_WORKSPACE/25.12/diy-part2.sh"
      - name: Align Go with the 25.12 packages feed
        working-directory: openwrt
        run: |
          mv feeds/packages/lang/golang "$RUNNER_TEMP/golang-from-diy"
          git -C feeds/packages restore lang/golang
          ./scripts/feeds update -i packages
          ./scripts/feeds install -a
      - name: Configure and check
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/25.12/mt7986-clx-s20p.config" .config
          make defconfig
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-highpower-config.py" .config
      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s
      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s
      - name: Verify image and package manifest
        working-directory: openwrt
        run: |
          python3 "$GITHUB_WORKSPACE/25.12/check-s20p-highpower-image.py" bin/targets/mediatek/filogic
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: s20p-highpower-${{ github.run_id }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*s20p*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*s20p*initramfs*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/sha256sums
            source-revision.txt
          if-no-files-found: error
      - name: Publish firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s20p-highpower-${{ github.run_id }}
          name: S20P high-power 25.12 build ${{ github.run_number }}
          body: 'Source hxlls/n60pro-hightpower-immo at 072cd385386b5b7becad12b5c072d7ee2de01bf7. Hardware operation and transmit power require device validation.'
          files: |
            openwrt/bin/targets/mediatek/filogic/*s20p*sysupgrade*
            openwrt/bin/targets/mediatek/filogic/*s20p*initramfs*
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/sha256sums
            source-revision.txt
          fail_on_unmatched_files: true
